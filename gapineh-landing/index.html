    <script>
      // 1) Apply the saved theme before first paint (dark is the default).
      // 2) Load guard: if the app bundle cannot load (for example the project source was uploaded instead of
      //    the build output), show a visible explanation instead of a blank page.
      (function () {
        var d = document.documentElement;
        var t = 'dark';
        try { t = localStorage.getItem('gapineh-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
        d.setAttribute('data-theme', t);
        function fail() {
          if (d.getAttribute('data-app') === 'ready') return;
          var el = document.getElementById('boot-error');
          if (el) el.hidden = false;
        }
        var bundleFailed = false;
        var retryUsed = false;
        function retryBundle() {
          var tag = document.querySelector('script[src*="/assets/index-"]');
          if (!tag) { fail(); return; }
          var src = tag.getAttribute('src');
          var el = document.createElement('script');
          el.src = src + (src.indexOf('?') === -1 ? '?' : '&') + 'gv=' + Date.now();
          el.defer = true;
          document.head.appendChild(el);
        }
        document.addEventListener('click', function (e) {
          if (e && e.target && e.target.id === 'boot-retry') window.location.reload();
        });
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (el && el.tagName === 'SCRIPT' && el.src && el.src.indexOf('/assets/index-') !== -1) {
            bundleFailed = true;
            // یک بار با دورزدن کش دوباره تلاش کن؛ اگر باز هم نشد، خطا را نشان بده.
            if (!retryUsed) { retryUsed = true; setTimeout(retryBundle, 800); }
            else { fail(); }
          }
        }, true);
        window.addEventListener('load', function () {
          var tries = 0;
          (function check() {
            if (d.getAttribute('data-app') === 'ready') return;
            if (!document.getElementById('boot-error')) return;
            tries += 1;
            if (tries >= 12) { fail(); return; }
            setTimeout(check, 2500);
          })();
        });
      })();
    </script>
