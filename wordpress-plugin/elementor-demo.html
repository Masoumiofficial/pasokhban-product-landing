<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دموی امبد در برگهٔ المنتور (Elementor Canvas)</title>
<style>
  /* شبیه‌سازی برگهٔ Elementor Canvas: بدون هدر/فوتر قالب، بدون حاشیه */

  iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
</style>
</head>
<body>
  <!-- این همان خروجی شورت‌کد [gapineh_landing] داخل ابزارک «کد کوتاه» المنتور است -->
  <div class="gapineh-embed" style="width:100%;margin:0;padding:0;line-height:0;">
    <iframe src="./gapineh-landing/app/index.html" title="لندینگ گپینه" loading="eager" allowfullscreen></iframe>
  </div>
</body>
</html>
