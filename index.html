<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PSB_TITLE%</title>
    <meta name="description" content="%PSB_DESCRIPTION%" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark light" />
    <meta name="pasokhban-landing-version" content="%PSB_LANDING_VERSION%" />
    <link rel="icon" type="image/svg+xml" href="/pasokhban-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="%PSB_NAME%" />
    <meta property="og:title" content="%PSB_OG_TITLE%" />
    <meta property="og:description" content="%PSB_OG_DESCRIPTION%" />
    <meta property="og:image" content="%PSB_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    %PSB_EXTRA_HEAD%
    <script type="application/ld+json">%PSB_JSON_LD%</script>
    <script>
      // 1) Apply the saved theme before first paint (dark is the default).
      // 2) Load guard: if the app bundle cannot load (for example the project source was uploaded instead of
      //    the build output), show a visible explanation instead of a blank page.
      (function () {
        var d = document.documentElement;
        var t = 'dark';
        try { t = localStorage.getItem('pasokhban-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
        d.setAttribute('data-theme', t);
        function fail() {
          if (d.getAttribute('data-app') === 'ready') return;
          var el = document.getElementById('boot-error');
          if (el) el.hidden = false;
        }
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (el && el.tagName === 'SCRIPT') fail();
        }, true);
        window.addEventListener('load', function () { setTimeout(fail, 4000); });
      })();
    </script>
    <style>
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 24px; text-align: center; background: #0b1120; color: #e2e8f0; font-family: 'Vazirmatn Variable', Tahoma, sans-serif; }
      [data-theme='light'] .boot { background: #f4f7fb; color: #1e293b; }
      .boot__mark { width: 72px; height: 72px; }
      .boot__name { margin: 6px 0 0; font-size: 1.5rem; font-weight: 800; }
      .boot__tagline { margin: 0; font-size: 1rem; opacity: 0.85; }
      .boot__error { max-width: 560px; margin-top: 18px; padding: 14px 18px; border-radius: 12px; border: 1px solid #f59e0b; background: rgba(245, 158, 11, 0.12); line-height: 1.9; font-size: 0.95rem; }
      .boot__error strong { display: block; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <svg class="boot__mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <circle cx="32" cy="32" r="30" fill="#22d3ee" />
          <path d="M24 12h16c3.3 0 6 2.7 6 6v18c0 3.3-2.7 6-6 6h-8l-7 7v-7h-1c-3.3 0-6-2.7-6-6V18c0-3.3 2.7-6 6-6z" fill="#fff" />
          <circle cx="27" cy="25" r="2.5" fill="#22d3ee" />
          <circle cx="37" cy="25" r="2.5" fill="#22d3ee" />
          <path d="M27.5 31.5c1.6 2.6 7.4 2.6 9 0" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" fill="none" />
        </svg>
        <p class="boot__name">پاسخ‌بان</p>
        <p class="boot__tagline">چت هوشمند، پاسخ انسانی، در یک افزونه‌ی وردپرس.</p>
        <noscript><p class="boot__error">برای دیدن کامل این صفحه، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
        <div class="boot__error" id="boot-error" role="alert" hidden>
          <strong>صفحه کامل بارگذاری نشد.</strong>
          اگر مدیر این سایت هستید: به‌جای فایل‌های سورس پروژه (پوشه‌ی src و package.json)، محتویات خروجی بیلد را
          آپلود کنید؛ یعنی فایل index.html و پوشه‌ی assets از داخل فایل zip آماده.
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
